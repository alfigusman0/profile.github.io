version: 2.1

# Situs statis tanpa dependensi npm: tidak ada job audit.
# Job build hanya memverifikasi image bisa dibangun dan menyajikan situs (tanpa push).

jobs:
  build:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Build image (linux/amd64, tanpa push)
          command: |
            docker buildx build --platform linux/amd64 \
              -t profile-site:ci --load .
      - run:
          name: Smoke test (GET / = 200, path tak ada = 404)
          command: |
            NAME="profile-ci-${CIRCLE_WORKFLOW_ID:-local}-${CIRCLE_BUILD_NUM:-0}"
            docker run -d --name "$NAME" -p 127.0.0.1:18080:8080 profile-site:ci
            trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ || true)
              [ "$code" = "200" ] && break
              sleep 1
            done
            echo "GET / -> $code"
            [ "$code" = "200" ]
            nf=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/nonexistent)
            echo "GET /nonexistent -> $nf"
            [ "$nf" = "404" ]

workflows:
  build:
    jobs:
      - build
